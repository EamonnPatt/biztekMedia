---
# cPanel → Git Version Control runs these steps on "Deploy HEAD Commit".
# The repo lives in /home/rcfwp52q6knr/repositories/biztekMedia (outside the website);
# these steps copy the site into public_html and the code into biztek-private.
# They never touch config.php, uploaded files, or anything else already in public_html.
deployment:
  tasks:
    - export HOMEDIR=/home/rcfwp52q6knr
    - /bin/mkdir -p $HOMEDIR/public_html $HOMEDIR/biztek-private
    - /bin/cp -R public_html/. $HOMEDIR/public_html/
    - /bin/cp -R biztek-private/lib $HOMEDIR/biztek-private/
    - /bin/cp biztek-private/.htaccess biztek-private/config.sample.php $HOMEDIR/biztek-private/
